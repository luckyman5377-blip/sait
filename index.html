<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Файлы cookie</title>
<style>
  :root { --bg:#f3f4f7; --card:#ffffff; --text:#1c1f26; --muted:#5f6675; --accent:#2563eb; --line:#dcdfe6; --shadow:0 12px 40px rgba(0,0,0,.18); }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12141a; --card:#1d2029; --text:#eceef3; --muted:#a0a6b4; --accent:#3b82f6; --line:#2d3240; --shadow:0 12px 40px rgba(0,0,0,.6); }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; overflow:hidden; }
  .banner { position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
    width:min(720px, calc(100% - 32px)); background:var(--card); border:1px solid var(--line);
    border-radius:16px; box-shadow:var(--shadow); padding:20px 22px;
    display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
  .icon { font-size:2.2rem; line-height:1; }
  .text { flex:1 1 260px; min-width:0; }
  .text h1 { font-size:1.05rem; margin:0 0 6px; }
  .text p { margin:0; font-size:.9rem; line-height:1.45; color:var(--muted); }
  .actions { display:flex; gap:10px; flex:0 0 auto; }
  button { padding:11px 20px; font-size:.95rem; border-radius:10px; border:1px solid var(--line);
    background:transparent; color:var(--text); cursor:pointer; font-family:inherit; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  button:active { transform:scale(.98); }
  #note { width:100%; font-size:.85rem; color:var(--muted); min-height:1.1em; }
  #pic { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:#000; z-index:10; }
  #pic img { max-width:100%; max-height:100%; width:100%; height:100%; object-fit:contain; }
  @media (max-width:520px) { .actions { width:100%; } .actions button { flex:1; } }
</style>
</head>
<body>

<div class="banner" role="dialog" aria-label="Согласие на использование файлов cookie">
  <div class="icon">🍪</div>
  <div class="text">
    <h1>Мы используем файлы cookie</h1>
    <p>Этот сайт обрабатывает файлы cookie и данные об устройстве, чтобы улучшать работу сервиса. Продолжая, вы даёте согласие на обработку данных.</p>
  </div>
  <div class="actions">
    <button id="decline">Отказаться</button>
    <button id="accept" class="primary">Принять</button>
  </div>
  <div id="note"></div>
</div>
